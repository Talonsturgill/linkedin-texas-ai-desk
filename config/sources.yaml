discovery:
  enabled: true
  rule: >
    Credible sources outside this list are allowed. Record why they are credible, who controls
    them, whether they are independent of the subject, and which exact claim they support.
  geographic_balance: >
    Search statewide. Include Austin, Dallas-Fort Worth, Houston, San Antonio, El Paso, the Rio
    Grande Valley, the Panhandle, the Permian Basin, Central Texas, East Texas, and rural regions
    as the subject matter warrants. Do not force a region into a story with no real connection.
