source_policy:
  primary_required: true
  independent_corroborator_required: true
  fetched_pages_only: true
  search_snippets_are_sources: false
  syndicated_reprints_are_independent: false
  subject_controlled_posts: >
    A named executive's first-person post may establish that the executive announced a decision.
    It does not independently corroborate the decision or its consequence.
  access_rule: >
    Respect robots rules, paywalls, and access controls. If a source cannot be read, mark the gap
    and choose another candidate rather than inferring its contents.

